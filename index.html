<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI 声音知识图谱：TTS、ASR、RVC 声音克隆、AI 翻唱与音频工程的实战知识库，含 voice-workbench 五运行时落地实录。" />
  <title>AI 声音知识图谱 · 语音大模型与克隆全景</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <h2>AI 声音<span>知识图谱</span></h2>
        <span class="badge">voice-workbench</span>
      </div>
      <div class="search-wrap">
        <input type="search" id="searchBox" placeholder="搜索术语 / 条目 / 资源…（按 / 聚焦）" autocomplete="off" />
        <div id="searchMeta" class="search-meta" hidden></div>
      </div>
      <nav class="nav-menu" id="navMenu" aria-label="知识篇目"></nav>
      <footer class="sidebar-foot">由 <code>knowledge-export/build.js</code> 生成 · 数据源 <code>knowledge-atlas/js/data.js</code></footer>
    </aside>
    <main class="content-view" id="contentView">
      <header class="content-header" id="contentHeader">
        <h1 id="secTitle">AI 声音知识体系</h1>
        <p id="secSummary">系统梳理 TTS、ASR、RVC 声音克隆、AI 翻唱与音频工程。</p>
      </header>
      <div class="blocks-container" id="blocksContainer"></div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script>
    const data = window.VOICE_KNOWLEDGE_DATA;
    const nav = document.getElementById("navMenu");
    const container = document.getElementById("blocksContainer");
    const secTitle = document.getElementById("secTitle");
    const secSummary = document.getElementById("secSummary");
    const searchBox = document.getElementById("searchBox");
    const searchMeta = document.getElementById("searchMeta");

    const STATUS_TEXT = { active: "现役主流", classic: "经典架构", legacy: "偏旧参考" };

    /* 段落里的标记安全渲染：先整体转义 HTML（<laughter> 这类内容不能被浏览器当标签吞掉），
       再把数据源自己的 <b> 标记与 `code` 标记转回真实标签。顺序不能反。 */
    function renderInline(text) {
      return String(text)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/&lt;b&gt;([\s\S]*?)&lt;\/b&gt;/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    const VIEWS = [
      ...data.SECTIONS.map((s) => ({ id: s.id, label: `${s.icon} ${s.title}`, kind: "section", ref: s })),
      { id: "glossary", label: "📖 术语速查", kind: "glossary" },
      { id: "resources", label: "🔗 工具与资源", kind: "resources" },
    ];

    function card(heading, bodyHtml) {
      return `<section class="knowledge-card"><h3>${renderInline(heading)}</h3>${bodyHtml}</section>`;
    }

    function renderGlossary() {
      secTitle.textContent = "📖 术语速查";
      secSummary.textContent = `声音领域核心术语 ${data.GLOSSARY.length} 条（与项目内 glossary.ts 同源维护）。`;
      const cats = {};
      data.GLOSSARY.forEach((g) => { (cats[g.category] = cats[g.category] || []).push(g); });
      let html = "";
      Object.keys(cats).forEach((cat) => {
        const body = `<div class="glossary-grid">` + cats[cat].map((g) =>
          `<div class="term-card"><div class="term-name">${renderInline(g.term)}</div>` +
          `<div class="term-cat">${renderInline(g.category)}</div>` +
          `<p>${renderInline(g.explanation)}</p></div>`).join("") + `</div>`;
        html += card(`${cat} · ${cats[cat].length} 条`, body);
      });
      container.innerHTML = html;
    }

    function renderResources() {
      secTitle.textContent = "🔗 工具与资源";
      secSummary.textContent = `官方开源仓库 ${data.RESOURCES.length} 项。`;
      const cats = {};
      data.RESOURCES.forEach((r) => { (cats[r.category] = cats[r.category] || []).push(r); });
      let html = "";
      Object.keys(cats).forEach((cat) => {
        const body = `<div class="res-grid">` + cats[cat].map((r) =>
          `<a class="res-card" href="${r.url}" target="_blank" rel="noopener noreferrer">` +
          `<div class="res-top"><span class="res-name">${renderInline(r.name)}</span><span class="res-arrow">↗</span></div>` +
          `<div class="res-cat">${renderInline(r.category)}</div>` +
          `<p>${renderInline(r.desc)}</p>` +
          `<code class="res-url">${r.url.replace("https://", "")}</code></a>`).join("") + `</div>`;
        html += card(`${cat} · ${cats[cat].length} 项`, body);
      });
      container.innerHTML = html;
    }

    function renderSection(sec) {
      secTitle.textContent = `${sec.icon} ${sec.title} · ${sec.en}`;
      secSummary.textContent = sec.summary;
      container.innerHTML = "";

      sec.sections.forEach((b) => {
        const card = document.createElement("section");
        card.className = "knowledge-card";
        let html = `<h3>${renderInline(b.heading)}</h3>`;
        if (b.meta) {
          const status = STATUS_TEXT[b.meta.status] || b.meta.status || "";
          html += `<div class="meta-tag">${status}${b.meta.note ? "｜" + renderInline(b.meta.note) : ""}</div>`;
        }
        (b.paragraphs || []).forEach((p) => { html += `<p>${renderInline(p)}</p>`; });
        if (b.table) {
          html += `<div class="table-title">${renderInline(b.table.title)}</div>` +
            `<div class="table-scroll"><table class="data-table"><thead><tr>` +
            b.table.head.map((h) => `<th>${renderInline(h)}</th>`).join("") +
            `</tr></thead><tbody>` +
            b.table.rows.map((r) => `<tr>` + r.map((c) => `<td>${renderInline(c)}</td>`).join("") + `</tr>`).join("") +
            `</tbody></table></div>`;
        }
        if (b.callout) {
          html += `<div class="callout-box"><b>【${renderInline(b.callout.title)}】</b>${renderInline(b.callout.text)}</div>`;
        }
        card.innerHTML = html;
        container.appendChild(card);
      });
      window.scrollTo({ top: 0 });
    }

    /* 导航 + hash 路由：刷新/分享保状态（#/basics 等） */
    function buildNav() {
      nav.innerHTML = "";
      VIEWS.forEach((view) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.type = "button";
        btn.dataset.id = view.id;
        btn.textContent = view.label;
        btn.onclick = () => { location.hash = `#/${sec.id}`; };
        nav.appendChild(btn);
      });
    }

    function setActive(id) {
      document.querySelectorAll(".nav-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.id === id);
        if (b.dataset.id === id) b.scrollIntoView({ block: "nearest" });
      });
    }

    function route() {
      const id = (location.hash.replace(/^#\//, "") || VIEWS[0].id);
      const view = VIEWS.find((v) => v.id === id) || VIEWS[0];
      setActive(view.id);
      if (view.kind === "section") renderSection(view.ref);
      else if (view.kind === "glossary") renderGlossary();
      else renderResources();
      window.scrollTo({ top: 0 });
    }
    window.addEventListener("hashchange", route);

    /* 全文搜索：命中篇目在导航上高亮计数，输入清空即还原 */
    function searchText(query) {
      const q = query.trim().toLowerCase();
      const hits = {};
      if (!q) { searchMeta.hidden = true; return hits; }
      let total = 0;
      data.SECTIONS.forEach((sec) => {
        let count = 0;
        const inTitle = (sec.title + sec.en + sec.summary).toLowerCase().includes(q);
        sec.sections.forEach((b) => {
          const hay = [b.heading, b.meta && (b.meta.status + b.meta.note), ...(b.paragraphs || []),
            b.table ? [b.table.title, ...b.table.head, ...b.table.rows.flat()] : [],
            b.callout ? b.callout.title + b.callout.text : ""].flat().join(" ").toLowerCase();
          if (inTitle || hay.includes(q)) count += 1;
        });
        if (inTitle || count > 0) { hits[sec.id] = count; total += inTitle ? count + 1 : count; }
      });
      searchMeta.hidden = false;
      searchMeta.textContent = total > 0 ? `命中 ${total} 处，高亮篇目` : "无命中";
      return hits;
    }

    searchBox.addEventListener("input", () => {
      const q = searchBox.value.trim().toLowerCase();
      const hits = {};
      let total = 0;
      VIEWS.forEach((v) => {
        let count = 0;
        if (v.kind === "section") {
          const sc = v.ref;
          const inTitle = (sc.title + sc.en + sc.summary).toLowerCase().includes(q);
          if (q) sc.sections.forEach((b) => {
            const hay = [b.heading, b.meta && (b.meta.status + b.meta.note), ...(b.paragraphs || []),
              b.table ? [b.table.title, ...b.table.head, ...b.table.rows.flat()] : [],
              b.callout ? b.callout.title + b.callout.text : ""].flat().join(" ").toLowerCase();
            if (hay.includes(q)) count += 1;
          });
          if (inTitle) count += 1;
        } else if (v.kind === "glossary") {
          count = q ? data.GLOSSARY.filter((g) => (g.term + g.category + g.explanation).toLowerCase().includes(q)).length : 0;
        } else {
          count = q ? data.RESOURCES.filter((r) => (r.name + r.category + r.desc + r.url).toLowerCase().includes(q)).length : 0;
        }
        if (count > 0) { hits[v.id] = count; total += count; }
      });
      searchMeta.hidden = !q;
      searchMeta.textContent = !q ? "" : total > 0 ? `命中 ${total} 处（篇目 / 术语 / 资源）` : "无命中";
      document.querySelectorAll(".nav-btn").forEach((b) => {
        const hit = hits[b.dataset.id];
        b.classList.toggle("hit", !!hit);
        b.title = hit ? `命中 ${hit} 个条目` : "";
      });
    });

    buildNav();
    route();
  </script>
</body>
</html>
